const slides=[
{t:"神經網路架構：左輸入、中間處理、右輸出",b:"Step 1：先理解 AI 的系統形狀",d:diagrams.nn,h:`<p>神經網路可以先用最簡單的系統觀點理解：左邊是輸入資料，中間是神經元與權重組成的處理層，右邊是輸出結果。</p><ul><li>輸入層接收資料，例如文字、影像、感測資料。</li><li>隱藏層負責特徵抽取與模式轉換。</li><li>輸出層產生分類、預測、文字或決策結果。</li></ul><div class="callout"><b>第一性原理：</b>神經網路是一個「資料轉換系統」。</div>`},
{t:"神經網路的學習：前向預測與反向修正",b:"Step 2：AI 為什麼會變聰明",d:diagrams.learn,h:`<p>神經網路不只是把資料從左送到右，它還會根據錯誤修正內部權重。</p><ul><li>前向傳播：由輸入產生預測結果。</li><li>Loss 計算：比較預測與目標的差距。</li><li>反向傳播：把誤差責任往回分配。</li><li>參數更新：讓下一次預測更準確。</li></ul>`},
{t:"PLC 系統架構：Input → CPU → Output",b:"Step 3：再理解 PLC 的系統形狀",d:diagrams.plc,h:`<p>PLC 控制系統在架構上也可以抽象成：左邊輸入，中間 CPU 處理，右邊輸出。</p><ul><li>Input：按鈕、感測器、類比訊號。</li><li>CPU：執行 PLC 程式與掃描週期。</li><li>Output：馬達、電磁閥、燈號、伺服命令。</li></ul><div class="callout"><b>第一性原理：</b>PLC 是「確定性訊號控制系統」。</div>`},
{t:"PLC CPU 的核心：掃描週期與 IEC 61131-3",b:"Step 4：PLC 中間處理層是什麼",d:diagrams.scan,h:`<p>PLC 的 CPU 週期性掃描：讀取輸入、執行程式、更新輸出。</p><ul><li>讀取輸入：把現場訊號讀入記憶體。</li><li>執行程式：依照 LD、FBD、SCL 等邏輯處理。</li><li>更新輸出：把結果送到輸出模組。</li></ul><div class="callout"><b>重要校正：</b>SCL 是 IEC 61131-3 定義的 PLC 程式語言之一，不是 IEC 61131-1。</div>`},
{t:"共同抽象：兩者都是訊號轉換系統",b:"Step 5：開始建立類比",d:diagrams.mapping,h:`<p>神經網路與 PLC 不是同一種技術，但可以用相同的抽象模型來理解。</p><div class="kpi"><div><b>AI 神經網路</b><br>資料輸入 → 神經網路 → 預測輸出</div><div><b>PLC 控制系統</b><br>現場輸入 → CPU 程式 → 現場輸出</div></div><p>這個類比能讓 PLC 學習者更快理解 AI 的系統觀。</p>`},
{t:"不要混淆層級：架構層、語言層、思想層",b:"Step 6：建立嚴謹對應",d:diagrams.levels,h:`<p>把 PLC 與 AI 類比時，必須分清楚三個層級。</p><ul><li>架構層：Input → Processing → Output。</li><li>語言層：PLC 有 LD / FBD / SCL；AI 有 Python / PyTorch / TensorFlow。</li><li>思想層：PLC 有規則、狀態機、回授控制；AI 有五大學派與混合式 AI。</li></ul>`},
{t:"LD、FBD、SCL 沒有絕對好壞，重點是場景",b:"Step 7：PLC 語言像 AI 學派一樣是工具箱",d:diagrams.levels,h:`<p>LD、FBD、SCL 沒有絕對好壞，就像 AI 五大學派沒有單一勝利者。</p><ul><li>LD：適合電氣控制、接點邏輯、維修溝通。</li><li>FBD：適合功能塊、訊號流、Timer / Counter。</li><li>SCL：適合複雜流程、狀態機、資料處理、模組化邏輯。</li></ul><div class="callout"><b>工程觀點：</b>成熟系統通常是多語言、多方法融合。</div>`},
{t:"為什麼 PLC 學習者要快點學 SCL",b:"Step 8：SCL 是 AI 協同開發最容易對接的 PLC 語言",d:diagrams.scl,h:`<p>SCL 在 PLC 世界中的角色，可以類比為 AI 與軟體世界中的 Python：不是唯一語言，但非常適合複雜邏輯與人機協作。</p><ul><li>SCL 結構清楚，適合 AI 生成、重構與審查。</li><li>SCL 容易表達 FSM、CASE、IF、資料處理與演算法。</li><li>SCL 比圖形語言更適合版本管理與文字比對。</li></ul><div class="callout"><b>教學主張：</b>學 PLC 的人要快點學 SCL，才能跟上 AI 時代的工程協作方式。</div>`},
{t:"兩個不同系統如何融合",b:"Step 9：PLC 負責確定控制，AI 負責智慧輔助",d:diagrams.fusion,h:`<p>PLC 與 AI 的融合，不是讓 AI 直接取代 PLC，而是讓兩者各自負責擅長的部分。</p><div class="kpi"><div><b>PLC 擅長</b><br>即時控制、安全互鎖、確定性邏輯、設備輸出。</div><div><b>AI 擅長</b><br>資料分析、異常偵測、策略建議、程式草稿生成。</div></div><p>未來的智慧控制系統會把 PLC 的可靠性與 AI 的學習能力結合在一起。</p>`},
{t:"未來工程學模式：Prompt → SCL → Simulation → Refinement",b:"Step 10：AI 時代的 PLC 工作流",d:diagrams.future,h:`<p>未來 PLC 工程師的能力核心會改變。不是只問「我會不會寫程式」，而是問「我能不能定義問題、讓 AI 產出、再用工程方法驗證與修正」。</p><ul><li>Prompt：把需求、I/O、限制條件說清楚。</li><li>SCL：由 AI 協助產生可檢查的程式草稿。</li><li>Simulation：用 FactoryIO、PLCSIM 或實機驗證。</li><li>Refinement：根據結果反向修正邏輯與 Prompt。</li></ul>`},
{t:"教學總結：PLC × AI 的未來工程師",b:"Final：從寫程式升級為設計系統",d:diagrams.fusion,h:`<p>這套類比的真正價值，不是說 PLC 等於神經網路，而是讓學生理解：未來工程師要同時掌握確定控制與智慧協作。</p><div class="callout"><b>一句話總結：</b>PLC 負責讓設備可靠執行，AI 負責讓工程師更快理解、生成、驗證與改進。</div><div class="callout"><b>核心主張：</b>SCL 是 PLC 與 AI 協同開發的重要橋梁。會 SCL 的 PLC 工程師，會更快進入 AI 協作時代。</div><div class="promptbox" id="prompt1">教學用 Prompt 範例：
請把這個 PLC 控制需求轉成 SCL，但在生成程式前，請先建立 Input → CPU Processing → Output 的系統模型。接著列出狀態機、DO Owner、互鎖條件與 Watch Table 驗證項目。最後生成符合 IEC 61131-3 SCL 風格的程式碼，並說明哪些邏輯適合用 LD / FBD / SCL 表達。</div><button class="copy" onclick="copyText('prompt1')">複製 Prompt</button>`}
];

let current=0;const nav=document.getElementById("nav");const slidesEl=document.getElementById("slides");
function render(){nav.innerHTML=slides.map((s,i)=>`<button class="${i===current?'active':''}" onclick="go(${i})">${i+1}. ${s.t}</button>`).join("");slidesEl.innerHTML=slides.map((s,i)=>`<section class="slide ${i===current?'active':''}"><div class="grid"><div class="card"><span class="badge">${s.b}</span><h2>${s.t}</h2>${s.h}</div><div class="card"><div class="diagram">${s.d}</div><p class="note">本頁為向量 SVG 示意圖，可離線展示；內容可作為課堂逐頁講解。</p></div></div><div class="controls"><button onclick="prev()">上一頁</button><div class="counter">${i+1} / ${slides.length}</div><button onclick="next()">下一頁</button></div></section>`).join("")}
function go(i){current=i;render()}function next(){current=(current+1)%slides.length;render()}function prev(){current=(current-1+slides.length)%slides.length;render()}
function copyText(id){navigator.clipboard.writeText(document.getElementById(id).innerText).then(()=>alert("已複製 Prompt"))}
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")next();if(e.key==="ArrowLeft")prev()});render();
</script>
</body>
