const slides=[
{t:'課程總覽：AI 軸 × 工業軸雙軌演進',b:'開課定位',d:diagrams.cover,h:`<p>這份教材把 AI 發展與工業演進放在同一張雙軌時間線觀察。</p><div class="kpi"><div><b>左邊 AI</b><br>1956 AI 元年、符號主義、機器學習，到 LLM / ChatGPT。</div><div><b>右邊工業</b><br>工業3.0 PLC 自動化，到工業4.0 智慧製造。</div></div><div class="callout"><b>課程金句：</b>AI 在生成邏輯，PLC 在執行邏輯，SCL 是兩者最容易接軌的工程語言。</div>`},
{t:'階段1：1956 AI 元年 vs 工業3.0 自動化',b:'規則時代',d:diagrams.stage1,h:`<p>1956 年 AI 成為獨立研究領域；1960 年代工業3.0逐漸成形，PLC 讓控制邏輯從硬接線轉為可程式化。</p><table><tr><th>5W2H</th><th>AI</th><th>工業</th></tr><tr><td>What</td><td>符號主義、規則推理</td><td>PLC、電子控制、自動化</td></tr><tr><td>Why</td><td>模擬人類推理</td><td>取代硬接線與人工操作</td></tr><tr><td>How</td><td>IF-THEN、知識表示</td><td>LD / FBD、掃描週期</td></tr></table><div class="callout"><b>本質：</b>兩者都是把人類決策變成機器可執行規則。</div>`},
{t:'階段2：資料時代',b:'AI 機器學習 × 工業 SCADA / MES',d:diagrams.stage2,h:`<p>AI 從規則推理走向統計與機器學習；工業現場透過 SCADA、MES、資料庫把產線狀態變成可監控、可分析的資訊。</p><table><tr><th>SWOT</th><th>AI</th><th>工業</th></tr><tr><td>Strength</td><td>能從資料找模式</td><td>可視化、可追溯、可管理</td></tr><tr><td>Weakness</td><td>依賴資料品質</td><td>系統整合成本高</td></tr><tr><td>Opportunity</td><td>預測與分類能力提升</td><td>品質、稼動率、能耗優化</td></tr><tr><td>Threat</td><td>錯誤資料導致錯誤模型</td><td>資料孤島與標準不一致</td></tr></table>`},
{t:'階段3：LLM vs 工業4.0',b:'模型時代',d:diagrams.stage3,h:`<p>LLM 讓 AI 從分析資料進一步走向生成文字、程式與解題流程；工業4.0強調連網、數據、數位雙生與智慧製造。</p><table><tr><th>5W2H</th><th>AI / LLM</th><th>工業4.0</th></tr><tr><td>What</td><td>生成語言、生成邏輯、生成程式</td><td>智慧製造、數位雙生、預測維護</td></tr><tr><td>Why</td><td>降低知識轉換成本</td><td>提高彈性、效率與品質</td></tr><tr><td>How</td><td>Prompt、LLM、工具調用</td><td>PLC、SCADA、MES、IIoT、AI整合</td></tr></table><div class="callout"><b>核心轉變：</b>工業3.0 是人寫邏輯；工業4.0 是 AI 協助生成邏輯，人負責驗證與修正。</div>`},
{t:'SCL：AI 與 PLC 的橋接語言',b:'課程核心主張',d:diagrams.scl,h:`<p>SCL 是 IEC 61131-3 定義的結構化文字語言。它不是唯一的 PLC 語言，但最適合與 AI 協同開發。</p><ul><li>比 LD / FBD 更容易被 LLM 產生與重構。</li><li>比圖形語言更適合版本管理、比對與審查。</li><li>適合描述 FSM、CASE、IF、資料處理與複雜流程。</li></ul><div class="callout"><b>教學主張：</b>學 PLC 的人要快點學 SCL，才能跟上 AI 時代的工程協作。</div>`},
{t:'AI × PLC × FactoryIO 工作流',b:'實作主線',d:diagrams.workflow,h:`<p>開課時不要只講概念，必須讓學生看到可執行流程。建議使用 FactoryIO 作為可視化驗證平台。</p><table><tr><th>流程</th><th>教師任務</th><th>學生任務</th></tr><tr><td>Prompt</td><td>引導需求鎖定與 I/O 語意</td><td>寫出完整控制需求</td></tr><tr><td>SCL</td><td>示範 AI 協同生成</td><td>檢查語法與邏輯</td></tr><tr><td>FactoryIO</td><td>建立實測場景</td><td>觀察輸出是否符合預期</td></tr><tr><td>Refinement</td><td>帶學生反向追因</td><td>修正 Prompt 與 SCL</td></tr></table>`},
{t:'SWOT：這門課的定位與風險',b:'課程設計評估',d:diagrams.swot,h:`<p>要做到可以開課，必須同時說清楚優勢、限制、機會與風險。</p><table><tr><th>項目</th><th>說明</th></tr><tr><td>Strength</td><td>AI 可以快速產生 SCL 草稿，FactoryIO 可快速驗證。</td></tr><tr><td>Weakness</td><td>學生容易只複製答案，不理解狀態、互鎖與 DO Owner。</td></tr><tr><td>Opportunity</td><td>可建立 AI × PLC × FactoryIO 的新世代課程。</td></tr><tr><td>Threat</td><td>若不會驗證，AI 錯誤會被誤認為正確。</td></tr></table>`},
{t:'開課用 5W2H 課程規劃',b:'可直接轉成課綱',d:diagrams.final,h:`<table><tr><th>5W2H</th><th>課程設計</th></tr><tr><td>Who</td><td>PLC 初學者、電機自動化學生、現場工程師。</td></tr><tr><td>What</td><td>學習 AI 協同開發 SCL，並用 FactoryIO 驗證。</td></tr><tr><td>Why</td><td>AI 時代的 PLC 工程師要會生成、驗證、修正。</td></tr><tr><td>Where</td><td>教室、職訓中心、企業內訓、技職院校。</td></tr><tr><td>When</td><td>建議 6 到 12 小時入門，24 小時以上可做完整專題。</td></tr><tr><td>How</td><td>Prompt → SCL → TIA Portal → FactoryIO → Debug。</td></tr><tr><td>How much</td><td>以軟體模擬降低實機成本，保留真實工程邏輯。</td></tr></table>`},
{t:'可複製 Prompt：AI × PLC × SCL 課堂任務',b:'實戰工具',d:diagrams.workflow,h:`<p>以下 Prompt 可用於課堂練習，讓學生避免只問「幫我寫程式」。</p><div class="promptbox" id="p1">請擔任 Siemens PLC SCL 工程師與 PLC 教學助教。\n我的目標是用 FactoryIO 場景練習 AI 協同開發 SCL。\n請依照以下流程協助我：\n1. 先建立 Input → CPU Processing → Output 的控制系統模型。\n2. 鎖定所有 DI / DO 的語意，特別標註 NO / NC 與 TRUE / FALSE 的實際意義。\n3. 建立狀態機 FSM，列出每個狀態的進入、保持、退出條件。\n4. 建立 DO Owner 表，確認每個輸出只能由單一邏輯負責。\n5. 生成 IEC 61131-3 SCL 程式草稿。\n6. 列出 Watch Table 驗證變數。\n7. 若實測失敗，請用反向學習方式從錯誤輸出回推可能原因，不要直接重寫整份程式。</div><button class="copy" onclick="copyText('p1')">複製 Prompt</button>`},
{t:'課程結論：未來工程師的四項能力',b:'結尾頁',d:diagrams.final,h:`<p>這門課的終點不是讓學生記住名詞，而是建立未來工程師能力模型。</p><div class="kpi"><div><b>1. 定義問題</b><br>把現場需求轉成精準工程語言與 Prompt。</div><div><b>2. 生成 SCL</b><br>用 AI 協助產出可審查、可驗證的 PLC 程式。</div><div><b>3. 驗證結果</b><br>用 FactoryIO、Watch Table、狀態表驗證。</div><div><b>4. 反向修正</b><br>從錯誤輸出回推條件、狀態與 Owner。</div></div><div class="callout"><b>最終金句：</b>PLC 是執行邏輯，LLM 是生成邏輯，SCL 是橋接語言。</div>`}
];
let current=0;const nav=document.getElementById('nav');const slidesEl=document.getElementById('slides');
function render(){nav.innerHTML=slides.map((s,i)=>`<button class="${i===current?'active':''}" onclick="go(${i})">${i+1}. ${s.t}</button>`).join('');slidesEl.innerHTML=slides.map((s,i)=>`<section class="slide ${i===current?'active':''}"><div class="grid"><div class="card"><span class="badge">${s.b}</span><h2>${s.t}</h2>${s.h}</div><div class="card soft"><div class="diagram">${s.d}</div><p class="note">本頁為 SVG 向量示意圖，可離線投影；左 AI、右工業的對照可直接用於課堂講解。</p></div></div><div class="controls"><button onclick="prev()">上一頁</button><div class="counter">${i+1} / ${slides.length}</div><button onclick="next()">下一頁</button></div></section>`).join('')}
function go(i){current=i;render()}function next(){current=(current+1)%slides.length;render()}function prev(){current=(current-1+slides.length)%slides.length;render()}function copyText(id){navigator.clipboard.writeText(document.getElementById(id).innerText).then(()=>alert('已複製 Prompt'))}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});render();
</script>
</body>
</html>
