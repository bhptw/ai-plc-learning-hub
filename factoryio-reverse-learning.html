<style>
:root{--bg:#07111f;--panel:#101827;--card:#172033;--card2:#0f2538;--text:#e8eef7;--muted:#9fb0c7;--blue:#4fb3ff;--red:#ff5d5d;--green:#3ddc97;--yellow:#ffd166;--line:#334155;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:linear-gradient(135deg,#020617,#0b1628);color:var(--text);}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh;}
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:rgba(8,14,26,.96);border-right:1px solid var(--line);padding:18px;}
.sidebar h1{font-size:18px;line-height:1.45;margin:0 0 14px;}
.sidebar p{font-size:13px;color:var(--muted);line-height:1.6;}
.nav button{display:block;width:100%;margin:7px 0;padding:11px 12px;text-align:left;color:var(--text);background:#101827;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:14px;line-height:1.35;}
.nav button.active,.nav button:hover{border-color:var(--blue);background:#12324b;}
main{padding:28px;}
.slide{display:none;max-width:1180px;margin:0 auto;}
.slide.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.card{background:rgba(23,32,51,.94);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.24);}
.card.soft{background:rgba(15,37,56,.9);}
h2{font-size:34px;line-height:1.25;margin:0 0 10px;}
h3{font-size:22px;color:#bde4ff;margin:8px 0 10px;}
p,li{font-size:18px;line-height:1.75;}
ul{padding-left:24px;margin-top:8px;}
.badge{display:inline-block;border:1px solid var(--blue);color:#d7efff;border-radius:999px;padding:6px 12px;margin-bottom:14px;font-size:14px;background:rgba(79,179,255,.08);}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px;}
.kpi div{background:#0d1727;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:16px;line-height:1.55;}
.stage{background:#0d1727;border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;font-size:17px;line-height:1.65;}
.stage b{color:var(--yellow);}
.controls{max-width:1180px;margin:18px auto 0;display:flex;align-items:center;justify-content:space-between;}
.controls button{background:var(--blue);border:0;color:#062036;font-weight:700;border-radius:12px;padding:12px 18px;cursor:pointer;}
.counter{color:var(--muted);}
.diagram{min-height:440px;background:#06101d;border:1px solid var(--line);border-radius:22px;overflow:hidden;position:relative;}
.diagram svg{width:100%;height:100%;min-height:440px;display:block;}
.note{font-size:14px;color:var(--muted);line-height:1.6;}
.flow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;}
.node{padding:12px 14px;background:#0d1727;border:1px solid var(--line);border-radius:12px;font-size:16px;}
.arrow{color:var(--blue);font-size:24px;}
.promptbox{white-space:pre-wrap;background:#07111f;border:1px solid var(--line);border-radius:16px;padding:16px;font-size:15px;line-height:1.65;color:#e8eef7;max-height:360px;overflow:auto;}
.copy{background:#1f3b52!important;color:#dff3ff!important;margin-top:10px;}
@media(max-width:940px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.grid{grid-template-columns:1fr}main{padding:18px}.kpi{grid-template-columns:1fr}h2{font-size:28px}}

="24" font-weight="700">先求有，再求好</text><text x="355" y="76" text-anchor="middle" fill="#e8eef7" font-size="20">先讓場景能運作，再用 Watch Table、狀態表、DO Owner 逐層反推與修正。</text><text x="355" y="112" text-anchor="middle" fill="#9fb0c7" font-size="18">學習重點不是複製答案，而是反向拆解答案如何形成。</text></g></svg>`,

const slides = [
{title:"從正確對應開始：LOGO FBD vs Backpropagation",badge:"第一頁：避免類比過度延伸",diagram:diagrams.logoBackprop,html:`<p>這個主題的第一個前提是：LOGO FBD 與 Backpropagation 不是同一種東西。LOGO FBD 是 PLC 圖形化邏輯設計；Backpropagation 是神經網路訓練演算法。</p><ul><li>LOGO FBD 的訊號執行方向通常仍是由輸入到輸出。</li><li>LOGO FBD 的設計思考常會從輸出 Q 往回推需要哪些條件。</li><li>Backpropagation 則是從 Loss 往回計算梯度，修正各層權重。</li><li>兩者真正相似處是：從結果回推原因，而不是執行機制相同。</li></ul>`},
{title:"第一性原理：輸入、轉換、輸出、回饋",badge:"系統思考的最小模型",diagram:diagrams.firstPrinciple,html:`<p>不管是 PLC、FBD、神經網路、FactoryIO 場景，或 AI 協同開發，都可以先拆成四個基本元素。</p><div class="kpi"><div><b>輸入 Input</b><br>感測器、按鈕、資料、Prompt。</div><div><b>轉換 Transform</b><br>邏輯、功能塊、模型、演算法。</div><div><b>輸出 Output</b><br>DO、動作、模型回答、SCL 代碼。</div></div><div class="stage"><b>回饋 Feedback：</b>用實測、錯誤、Loss、Watch Table、使用者評價，回頭修正中間邏輯。</div>`},
{title:"LOGO FBD：從 Q 反推條件的工程思維",badge:"不是倒著執行，是倒著設計",diagram:diagrams.logoBackprop,html:`<p>在 LOGO 面板或 LOGO!Soft Comfort 的 FBD 設計中，初學者常會先問：「我要 Q1 亮起，需要哪些條件？」這是典型的反向設計。</p><div class="flow"><span class="node">Q1 要 ON</span><span class="arrow">←</span><span class="node">功能塊輸出為 1</span><span class="arrow">←</span><span class="node">AND / OR / RS 條件成立</span><span class="arrow">←</span><span class="node">I1、I2、Timer 狀態</span></div><p>LOGO FBD 的學習價值在於：學生能用視覺化方式理解「輸出不是憑空出現，而是由條件鏈產生」。</p>`},
{title:"Backpropagation：從 Loss 反推每層責任",badge:"數學上的反向修正",diagram:diagrams.logoBackprop,html:`<p>Backpropagation 的核心不是「畫面從右往左」，而是「誤差責任從輸出端往前一層一層分配」。</p><ul><li>先做前向傳播：輸入 x 經過各層權重，得到預測值 y_hat。</li><li>再計算 Loss：比較 y_hat 與真實答案 y。</li><li>接著反向傳播：計算每個權重對 Loss 的影響程度。</li><li>最後更新權重：讓下一次預測更接近目標。</li></ul><p>一句話：Backpropagation 是讓模型知道「錯在哪一層、該改多少」。</p>`},
{title:"把概念延伸到 AI 協同開發 SCL",badge:"AI 先產生成品，人再反向理解",diagram:diagrams.factoryLoop,html:`<p>傳統學習通常是正向路徑：先學語法、再學架構、最後寫出程式。AI 協同開發則經常變成另一種路徑：先得到一份可運作的 SCL，再反向拆解它。</p><div class="stage"><b>正向學習：</b>需求 → 邏輯 → 程式 → 驗證。</div><div class="stage"><b>反向學習：</b>需求 → AI 產生 SCL → FactoryIO 驗證 → 反推狀態、條件、DO Owner、錯誤假設。</div><p>這不是偷懶，而是新的學習路徑。重點是不能停在「能動」，必須進一步追問「為什麼能動」。</p>`},
{title:"FactoryIO 場景：先求有，再求好",badge:"可運作只是起點",diagram:diagrams.factoryLoop,html:`<p>FactoryIO 很適合用來建立 AI 反向學習，因為它可以提供立即可觀察的機構結果。</p><ul><li>第一輪：先讓 AI 根據場景目的生成 SCL 草稿。</li><li>第二輪：把 SCL 放到 TIA Portal / PLCSIM / FactoryIO 實測。</li><li>第三輪：觀察哪個輸送帶、氣缸、感測器行為不符合預期。</li><li>第四輪：反向追查條件、狀態、Timer、Edge、DO Owner。</li><li>第五輪：修正 Prompt 與程式，建立可重複的方法。</li></ul>`},
{title:"反向學習四層拆解",badge:"從成品拆回需求",diagram:diagrams.reverseLayers,html:`<p>AI 生成的 SCL 不應該被視為最終答案，而應該被視為「可研究的工程樣本」。可以用四層反向拆解。</p><div class="stage"><b>第 1 層：可運作結果。</b>場景是否真的動？有沒有卡住？有沒有重複觸發？</div><div class="stage"><b>第 2 層：輸出行為。</b>每個 DO 為何 ON？由哪個 Cmd 或 State 擁有？</div><div class="stage"><b>第 3 層：條件與狀態。</b>每個狀態的進入、保持、退出條件是否明確？</div><div class="stage"><b>第 4 層：原始需求。</b>程式是否違背題目語意？有沒有 AI 自行補腦？</div>`},
{title:"學生不該只問：幫我寫 SCL",badge:"反向學習 Prompt 範本",diagram:diagrams.reverseLayers,html:`<p>真正有效的問法，是要求 AI 先產生可驗證成品，再要求 AI 幫你拆解邏輯來源。</p><div class="promptbox" id="prompt1">請根據我提供的 FactoryIO 場景目標與 Tags，先生成一份可驗證的 Siemens TIA Portal SCL 程式草稿。生成後不要只解釋語法，請用反向學習方式分析：
1. 每個輸出 DO 為什麼會 ON/OFF。
2. 每個 DO 的 Owner 是哪個狀態或命令變數。
3. 每個狀態的進入條件、保持條件、退出條件是什麼。

let current = 0;
const nav = document.getElementById("nav");
const slidesEl = document.getElementById("slides");
function render(){
    nav.innerHTML = slides.map((s,i)=>`<button class="${i===current?'active':''}" onclick="go(${i})">${i+1}. ${s.title}</button>`).join("");
    slidesEl.innerHTML = slides.map((s,i)=>`<section class="slide ${i===current?'active':''}"><div class="grid"><div class="card"><span class="badge">${s.badge}</span><h2>${s.title}</h2>${s.html}</div><div class="card soft"><div class="diagram">${s.diagram}</div><p class="note">本圖為教學用動畫式 SVG 示意，不使用外部圖片，適合離線投影與課堂展示。</p></div></div><div class="controls"><button onclick="prev()">上一頁</button><div class="counter">${i+1} / ${slides.length}</div><button onclick="next()">下一頁</button></div></section>`).join("");
}
function go(i){current=i;render();}
function next(){current=(current+1)%slides.length;render();}
function prev(){current=(current-1+slides.length)%slides.length;render();}
function copyText(id){
    const text = document.getElementById(id).innerText;
    navigator.clipboard.writeText(text).then(()=>alert("已複製 Prompt"));
}
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight") next(); if(e.key==="ArrowLeft") prev();});
render();
</script>
